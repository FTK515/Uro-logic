let current=0,page=0,mode='pen',color='#d64b4b',drawing=false,objects=[],selected=null,undoStack=[],redoStack=[];
const img=document.getElementById('diagram'),sheet=document.querySelector('.sheet'),c=document.getElementById('draw'),ctx=c.getContext('2d'),objLayer=document.getElementById('objects');
function status(t){document.getElementById('status').textContent=t}
function resize(){const r=sheet.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}
function snapshot(){return {canvas:c.toDataURL(),objects:objects.map(o=>({...o}))}}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>30)undoStack.shift();redoStack=[]}
function restore(s){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);objects=s.objects.map(o=>({...o}));selected=null;renderObjects()};im.src=s.canvas}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());status('Undone')}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());status('Redone')}
function renderList(q=''){const l=document.getElementById('list');l.innerHTML='';let last='';templates.forEach((t,i)=>{if(q&&!(`${t.cat} ${t.name}`).toLowerCase().includes(q.toLowerCase()))return;if(t.cat!==last){const d=document.createElement('div');d.className='cat';d.textContent=t.cat;l.appendChild(d);last=t.cat}const b=document.createElement('button');b.className='template'+(i===current?' active':'');b.textContent=t.name;b.addEventListener('click',()=>selectTemplate(i));l.appendChild(b)})}
function renderPages(){const pc=document.getElementById('pageChoice');const t=templates[current];pc.innerHTML='';if(!t.pages){pc.style.display='none';return}pc.style.display='inline-flex';pc.style.gap='5px';t.pages.forEach((p,i)=>{const b=document.createElement('button');b.className='pagebtn'+(i===page?' active':'');const labels=current===4?['Tumor anatomy','TURBT','Post-op CBI']:current===5?['BOO / bladder complications','BPH','TURP','Post-op CBI']:current===7?['Prostate cancer anatomy','Before / after radical prostatectomy','Pelvic lymph node anatomy','Trocar placement','Robot setup']:[];b.textContent=labels[i]||('Page '+(i+1));b.onclick=()=>selectPage(i);pc.appendChild(b)})}
function setSheetClass(){sheet.classList.remove('turbt-anatomy','turbt-procedure','turp-boo','turp-bph','turp-procedure','turp-cbi','rp-trocar','rp-robot');if(current===4){if(page===0)sheet.classList.add('turbt-anatomy');if(page===1)sheet.classList.add('turbt-procedure')}if(current===5){if(page===0)sheet.classList.add('turp-boo');if(page===1)sheet.classList.add('turp-bph');if(page===2)sheet.classList.add('turp-procedure');if(page===3)sheet.classList.add('turp-cbi')}if(current===7){if(page===3)sheet.classList.add('rp-trocar');if(page===4)sheet.classList.add('rp-robot')}}
function selectPage(i){page=i;const t=templates[current];setSheetClass();img.src=t.pages?page< t.pages.length?t.pages[page]:t.pages[0]:t.src;clearAll(false);renderPages();status('Ready')}

function clearAll(record=true){if(record)pushUndo();ctx.clearRect(0,0,c.clientWidth,c.clientHeight);objects=[];selected=null;renderObjects()}
function point(e){const r=c.getBoundingClientRect();const z=zoom/100;return [(e.clientX-r.left)/z,(e.clientY-r.top)/z]}
function addObject(type,x,y){pushUndo();const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));let o={id,type,x,y,w:20,h:20,scale:1,rotation:0,color};if(type==='blade')o={...o,w:80,h:5};if(type==='arrow')o={...o,w:100,h:5};if(type==='stent')o={...o,w:70,h:260,side:document.getElementById('stentSide').value,color:'#2367a5'};objects.push(o);selected=id;renderObjects();status(type==='stent'?(o.side==='right'?'Right':'Left')+' JJ added':' '+type+' added')}
function makeEl(o){const isSel=selected===o.id;const el=document.createElement('div');el.className='obj '+o.type+(isSel?' selected':'');el.dataset.id=o.id;el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.width=(o.w*o.scale)+'px';el.style.height=(o.h*o.scale)+'px';el.style.color=o.color;el.style.transform='rotate('+o.rotation+'deg)';if(o.type==='stent'){const im=document.createElement('img');im.src=o.side==='right'?IMAGES.RIGHT:IMAGES.LEFT;im.decoding='async';el.appendChild(im)}if(isSel){const h=document.createElement('div');h.className='handle';h.addEventListener('pointerdown',e=>resizeObj(e,o));el.appendChild(h);const rh=document.createElement('div');rh.className='rotate-handle';rh.title='Rotate';rh.setAttribute('aria-label','Rotate object');rh.addEventListener('pointerdown',e=>rotateObj(e,o));el.appendChild(rh)}el.addEventListener('pointerdown',e=>dragObj(e,o));return el}
function renderObjects(){objLayer.innerHTML='';objects.forEach(o=>objLayer.appendChild(makeEl(o)))}
function dragObj(e,o){if(mode!=='select' && mode!=='stent' && mode!=='stone' && mode!=='blade' && mode!=='arrow')return;if(e.target.classList.contains('handle')||e.target.classList.contains('rotate-handle'))return;e.preventDefault();e.stopPropagation();if(mode==='select' && selected===o.id && e.detail>1){selected=null;renderObjects();status('Selection cleared');return}selected=o.id;renderObjects();const sx=e.clientX,sy=e.clientY,ox=o.x,oy=o.y;const move=ev=>{o.x=ox+(ev.clientX-sx)/(zoom/100);o.y=oy+(ev.clientY-sy)/(zoom/100);renderObjects()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);status('Moved')};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
function resizeObj(e,o){e.preventDefault();e.stopPropagation();const start=e.clientX,s=o.scale;const move=ev=>{o.scale=Math.max(.2,Math.min(5,s+(ev.clientX-start)/(150*(zoom/100))));renderObjects()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);status('Resized')};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
function rotateObj(e,o){e.preventDefault();e.stopPropagation();selected=o.id;renderObjects();const el=document.querySelector('.obj[data-id="'+o.id+'"]');const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const start=Math.atan2(e.clientY-cy,e.clientX-cx);const base=o.rotation;const move=ev=>{const a=Math.atan2(ev.clientY-cy,ev.clientX-cx);let deg=base+(a-start)*180/Math.PI;o.rotation=Math.round(deg*10)/10;renderObjects()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);status('Rotated')};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
function down(e){if(['select','pan','stone','blade','stent','arrow'].includes(mode))return;e.preventDefault();drawing=true;pushUndo();const [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y)}
function move(e){if(!drawing)return;const [x,y]=point(e);ctx.lineWidth=mode==='highlighter'?18:mode==='eraser'?28:4;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.strokeStyle=mode==='highlighter'?'rgba(255,210,40,.35)':color;ctx.lineTo(x,y);ctx.stroke()}
function up(){drawing=false}
c.addEventListener('pointerdown',e=>{if(mode==='pan'){e.preventDefault();e.stopPropagation();return}if(mode==='select'){selected=null;renderObjects();status('Selection cleared');return}if(['stone','blade','stent','arrow'].includes(mode)){e.preventDefault();e.stopPropagation();const [x,y]=point(e);addObject(mode,x,y);return}down(e)});c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  mode=b.dataset.mode; panning=false; c.style.pointerEvents='auto'; objLayer.style.pointerEvents='none';
  selected=null; renderObjects(); document.getElementById('pan').classList.remove('active');
  document.getElementById('stentChoice').style.display=mode==='stent'?'inline':'none';
  status(mode==='pen'?'Draw with Pencil or mouse':'Tap the image to add '+mode);
}));

document.getElementById('undo').addEventListener('click',undo);document.getElementById('redo').addEventListener('click',redo);document.getElementById('clear').addEventListener('click',()=>clearAll(true));document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));window.addEventListener('resize',resize);img.addEventListener('load',resize);
document.addEventListener('keydown',e=>{if(e.key==='Delete'&&selected){pushUndo();objects=objects.filter(o=>o.id!==selected);selected=null;renderObjects()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
let zoom=100;
let panX=0, panY=0;
let panning=false, panStartX=0, panStartY=0, panBaseX=0, panBaseY=0;
function applyZoom(){sheet.style.transform='translate('+panX+'px,'+panY+'px) scale('+(zoom/100)+')';document.getElementById('zoomRange').value=zoom;document.getElementById('zoomVal').textContent=zoom+'%';}
function setZoom(v){zoom=Math.max(50,Math.min(200,Math.round(v/10)*10));applyZoom();}
function resetPan(){panX=0;panY=0;applyZoom();}
document.getElementById('zoomIn').onclick=()=>setZoom(zoom+10);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom-10);
document.getElementById('zoomFit').onclick=()=>{setZoom(100);resetPan();};
document.getElementById('zoomRange').oninput=e=>setZoom(+e.target.value);
const wrap=document.querySelector('.canvas-wrap');
// Desktop zoom: mouse wheel over the canvas zooms. Prevent browser scrolling/zooming.
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  setZoom(zoom+(e.deltaY<0?10:-10));
},{passive:false});
function beginPan(e){
  if(mode!=='pan') return false;
  if(e.pointerType==='mouse' && e.button!==0) return false;
  e.preventDefault(); e.stopPropagation();
  panning=true; panStartX=e.clientX; panStartY=e.clientY;
  panBaseX=panX; panBaseY=panY;
  try{wrap.setPointerCapture(e.pointerId)}catch(_){}
  wrap.classList.add('zooming');
  return true;
}
function movePan(e){
  if(!panning)return;
  e.preventDefault();
  panX=panBaseX+(e.clientX-panStartX);
  panY=panBaseY+(e.clientY-panStartY);
  applyZoom();
}
function endPan(e){
  if(!panning)return;
  panning=false; wrap.classList.remove('zooming');
  try{wrap.releasePointerCapture(e.pointerId)}catch(_){}
}
// Pan is handled at the wrapper level. Drawing/object layers are disabled while in Pan mode.
wrap.addEventListener('pointerdown',e=>{if(mode==='pan')beginPan(e)});
wrap.addEventListener('pointermove',movePan);
wrap.addEventListener('pointerup',endPan);
wrap.addEventListener('pointercancel',endPan);
wrap.addEventListener('contextmenu',e=>{if(mode==='pan')e.preventDefault()});
// Two-finger touch pan/pinch on iPad. Single-finger drag works only in Pan mode.
let pinchStartDist=0,pinchStartZoom=100,pinchStartX=0,pinchStartY=0;
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const a=e.touches[0],b=e.touches[1];
    pinchStartDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    pinchStartZoom=zoom; pinchStartX=(a.clientX+b.clientX)/2; pinchStartY=(a.clientY+b.clientY)/2;
    panBaseX=panX; panBaseY=panY;
  }
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  if(e.touches.length!==2)return;
  e.preventDefault();
  const a=e.touches[0],b=e.touches[1];
  const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const midX=(a.clientX+b.clientX)/2,midY=(a.clientY+b.clientY)/2;
  setZoom(pinchStartZoom*(dist/pinchStartDist));
  panX=panBaseX+(midX-pinchStartX); panY=panBaseY+(midY-pinchStartY); applyZoom();
},{passive:false});
wrap.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStartDist=0},{passive:false});

document.getElementById('pan').onclick=()=>{
  const b=document.getElementById('pan');
  if(mode==='pan'){
    b.classList.remove('active'); mode='pen'; panning=false;
    c.style.pointerEvents='auto'; objLayer.style.pointerEvents='none';
    document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='pen'));
    status('Pan off — draw mode restored');
  }else{
    mode='pan'; panning=false; selected=null; renderObjects();
    document.querySelectorAll('.tool[data-mode]').forEach(x=>x.classList.remove('active'));
    document.getElementById('select').classList.remove('active'); b.classList.add('active');
    document.getElementById('stentChoice').style.display='none';
    c.style.pointerEvents='none'; objLayer.style.pointerEvents='none';
    status('Pan mode — drag with left mouse or one finger; drawing disabled');
  }
};

function save(){const out=document.createElement('canvas');const w=img.naturalWidth,h=img.naturalHeight;out.width=w*2;out.height=h*2;const x=out.getContext('2d');x.drawImage(img,0,0,out.width,out.height);const ir=img.getBoundingClientRect(),sr=sheet.getBoundingClientRect(),sx=out.width/ir.width,sy=out.height/ir.height;x.drawImage(c,(ir.left-sr.left),(ir.top-sr.top),ir.width,ir.height,0,0,out.width,out.height);objects.forEach(o=>{const el=document.querySelector('.obj[data-id="'+o.id+'"]');if(!el)return;const er=el.getBoundingClientRect();const xx=(er.left-ir.left)*sx,yy=(er.top-ir.top)*sy,ww=er.width*sx,hh=er.height*sy;if(o.type==='stent'){const im2=new Image();im2.src=o.side==='right'?IMAGES.RIGHT:IMAGES.LEFT;x.drawImage(im2,xx,yy,ww,hh)}else if(o.type==='stone'){x.fillStyle=o.color;x.beginPath();x.arc(xx+ww/2,yy+hh/2,ww/2,0,Math.PI*2);x.fill()}else{x.save();x.translate(xx,yy);x.rotate(o.rotation*Math.PI/180);x.fillStyle=o.color;if(o.type==='blade')x.fillRect(0,0,ww,Math.max(3,hh));if(o.type==='arrow'){x.fillRect(0,hh/2-3,ww-10,6);x.beginPath();x.moveTo(ww,hh/2);x.lineTo(ww-15,hh/2-10);x.lineTo(ww-15,hh/2+10);x.closePath();x.fill()}x.restore()}});const a=document.createElement('a');a.download='uro-patient-explanation.png';a.href=out.toDataURL('image/png');a.click();status('Saved')}
document.getElementById('save').addEventListener('click',save);renderList();selectTemplate(0);
